<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nexa AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nexaCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
  </style>
</head>
<body>
  <canvas id="nexaCanvas"></canvas>

  <!-- Módulos do Raphael Core (Núcleo Visual Exclusivo da Nexa) -->
  <link rel="stylesheet" href="../raphael/raphael.css">
  <script src="../raphael/raphaelMath.js"></script>
  <script src="../raphael/raphaelThemes.js"></script>
  <script src="../raphael/raphaelAudioVisualizer.js"></script>
  <script src="../raphael/raphaelRings.js"></script>
  <script src="../raphael/raphaelCore.js"></script>
  <script src="../raphael/raphaelSubtitles.js"></script>

  <!-- Módulos da Janela Nexa -->
  <script src="nexaWebcam.js"></script>
  <script src="nexaRenderer.js"></script>
</body>
</html>
