<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nexa AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #nexaCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    /* Painel de resumo de resposta — exibido abaixo do Raphael Core */
    #nexa-reply-box {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 16px);
      max-width: 400px;
      background: rgba(10, 8, 28, 0.82);
      border: 1px solid rgba(120, 80, 255, 0.35);
      border-radius: 10px;
      padding: 8px 12px;
      color: #d4caff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 0 14px rgba(100, 60, 220, 0.25);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 100;
      word-break: break-word;
    }

    #nexa-reply-box.visible {
      opacity: 1;
    }

    #nexa-reply-box .nexa-reply-text {
      color: #e8e0ff;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="nexaCanvas"></canvas>

  <!-- Painel de resumo de resposta abaixo do Raphael Core -->
  <div id="nexa-reply-box">
    <span class="nexa-reply-text" id="nexa-reply-text"></span>
  </div>

  <!-- Módulos do Raphael Core (Núcleo Visual Exclusivo da Nexa) -->
  <link rel="stylesheet" href="../raphael/raphael.css">
  <script src="../raphael/raphaelMath.js"></script>
  <script src="../raphael/raphaelThemes.js"></script>
  <script src="../raphael/raphaelAudioVisualizer.js"></script>
  <script src="../raphael/raphaelRings.js"></script>
  <script src="../raphael/raphaelCore.js"></script>
  <script src="../raphael/raphaelSubtitles.js"></script>

  <!-- Módulos da Janela Nexa -->
  <script src="nexaWebcam.js"></script>
  <script src="nexaRenderer.js"></script>
</body>
</html>
