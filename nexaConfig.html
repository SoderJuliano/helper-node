<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações da Nexa</title>
    <link rel="stylesheet" href="styles/config.css">
    <style>
        .section-box {
            margin-bottom: 12px;
            padding: 12px 14px;
            background-color: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            -webkit-app-region: no-drag;
        }
        .section-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #00aaff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="config-titlebar">
        <div class="config-titlebar-left">
            <span class="drag-handle-dots" title="Clique e arraste a janela">⋮⋮</span>
            <span class="config-app-title">NEXA AI // HELPER NODE</span>
            <span class="config-titlebar-version">v0.8.0</span>
        </div>
        <div class="config-titlebar-right">
            <button id="win-maximize-btn" title="Tela cheia / restaurar" style="width:28px; height:28px; padding:0; margin:0; border:none; border-radius:6px; background:rgba(255,255,255,0.12); color:#fff; cursor:pointer; font-size:12px; display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
            <button id="win-close-btn" title="Fechar" style="width:28px; height:28px; padding:0; margin:0; border:none; border-radius:6px; background:rgba(255,70,70,0.35); color:#fff; cursor:pointer; font-size:12px; display:inline-flex; align-items:center; justify-content:center; -webkit-app-region:no-drag;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
    </div>

    <nav class="config-nav-tabs">
        <button type="button" class="nav-tab" data-tab="config.html" title="Configurações Gerais">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Geral</span>
        </button>
        <button type="button" class="nav-tab active" data-tab="nexaConfig.html" title="Configurações da Nexa">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
            <span>Nexa</span>
        </button>
        <button type="button" class="nav-tab" data-tab="apiConfig.html" title="APIs, Tokens e Provedores">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            <span>APIs & Provedores</span>
        </button>
        <button type="button" class="nav-tab" data-tab="preferences.html" title="Preferências do Usuário e Contexto">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Preferências</span>
        </button>
    </nav>

    <div class="container">
        <!-- 1. Estado e Identidade -->
        <div class="setting-item" style="margin-bottom: 10px;" title="Habilita a assistente Nexa e sua janela flutuante com avatar animado em tempo real.">
            <label for="nexa-toggle">Nexa AI Assistant</label>
            <div class="setting-actions">
                <span id="nexa-status" class="status-badge">OFF</span>
                <label class="switch">
                    <input type="checkbox" id="nexa-toggle" hidden>
                    <div class="switch__wrapper">
                        <div class="switch__toggle"></div>
                    </div>
                </label>
            </div>
        </div>

        <div class="setting-item" style="margin-bottom: 10px;" title="Nome pelo qual a assistente ou copiloto se identifica e responde. O padrão é Nexa, mas você pode alterar para Rafael ou qualquer outro nome.">
            <label for="nexa-name-input">Nome do(a) Assistente</label>
            <div class="setting-control input-group" style="width: 220px; max-width: 220px;">
                <input type="text" id="nexa-name-input" class="custom-input" placeholder="Nexa" value="Nexa" style="padding: 6px 10px; font-size: 13px;">
                <button type="button" id="reset-nexa-name-btn" class="clear-btn" style="background: rgba(0, 170, 255, 0.15); border-color: rgba(0, 170, 255, 0.35); color: #38bdf8;" title="Restaurar nome padrão (Nexa)">Padrão</button>
            </div>
        </div>

        <div class="setting-item" style="margin-bottom: 10px;" title="Focar ou abrir a janela do avatar flutuante da Nexa.">
            <label>Avatar Flutuante (360x360)</label>
            <div class="setting-actions">
                <button type="button" id="nexa-open-window-btn" style="background-color: #2b3038; border: 1px solid rgba(255,255,255,0.15); font-size: 12.5px; padding: 6px 14px;">Abrir / Focar Avatar</button>
            </div>
        </div>

        <!-- 2. Núcleo Visual Exclusivo -->
        <div class="section-box" style="margin-bottom: 10px;">
            <div class="section-title">
                <span>Núcleo Visual Integrado</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(0, 170, 255, 0.08); border: 1px solid rgba(0, 170, 255, 0.35); border-radius: 6px;">
                <div style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: #00f0ff;">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
                </div>
                <div>
                    <div style="font-size: 13px; font-weight: 700; color: #00f0ff;">Raphael Core (Ativo & Exclusivo)</div>
                    <div style="font-size: 11.5px; color: #cbd5e1; margin-top: 2px;">Núcleo tridimensional cósmico de plasma e anéis giroscópicos reativo em tempo real aos estados e ao áudio do sistema.</div>
                </div>
            </div>
        </div>

        <!-- 3. Microfone -->
        <div class="setting-item" style="margin-bottom: 10px;" title="Selecione o microfone utilizado pela Nexa para comandos de voz.">
            <label for="nexa-mic-select">Microfone de Entrada</label>
            <div class="setting-control cli-control-group">
                <select id="nexa-mic-select" class="custom-select" style="min-width: 220px;">
                    <option value="">Padrão do Sistema</option>
                </select>
                <div class="cli-actions">
                    <button type="button" id="nexa-mic-refresh" class="action-btn" style="background:#1a2e3a; color:#fff;" title="Recarregar microfones">Atualizar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="nexa-toast" style="display:none; margin-bottom:10px; padding:10px 14px; background:rgba(239, 68, 68, 0.9); color:#fff; border-radius:6px; font-size:12.5px; font-weight:600; text-align:center; -webkit-app-region:no-drag;"></div>

    <div class="config-footer-actions">
        <button id="save-btn" class="primary-btn">Salvar e Fechar</button>
        <button id="cancel-btn" type="button" class="secondary-btn">Fechar</button>
    </div>

    <script src="renderer/config/configNav.js"></script>
    <script src="nexaConfig.js"></script>
</body>
</html>
