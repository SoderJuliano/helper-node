<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Assistente em Tempo Real</title>
  <script>
    try {
      if (window.electronAPI && window.electronAPI.platform !== 'linux') {
        document.documentElement.classList.add('manual-drag');
      }
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="realtime-assistant-overlay.css">
</head>
<body>
  <div id="pos-header" draggable="false">
    <span class="title">🎙️ Assistente em Tempo Real</span>
    <button class="pos-btn" id="btn-left"    title="Esquerda" draggable="false">◀</button>
    <button class="pos-btn" id="btn-center"  title="Centro" draggable="false">◉</button>
    <button class="pos-btn" id="btn-right"   title="Direita" draggable="false">▶</button>
    <button class="pos-btn" id="btn-monitor" title="Próximo monitor" draggable="false">⊞</button>
    <button class="pos-btn" id="btn-clear"   title="Limpar mensagens" draggable="false">🗑</button>
    <button class="pos-btn" id="btn-pause"   title="Pausar/Retomar captura (ou use Ctrl+D)" draggable="false">⏸</button>
    <button class="pos-btn" id="btn-min"     title="Minimizar" draggable="false">–</button>
  </div>

  <div id="status-bar" draggable="false">
    <div id="status-dot" class="listening" draggable="false"></div>
    <span id="status-text" draggable="false">🎙️ Ouvindo microfone e áudio do sistema (ao vivo)...</span>
  </div>

  <div id="messages">
    <div id="empty">Capturando áudio continuamente.<br>Fale ou reproduza som para ver a transcrição e respostas automáticas aqui.<br><span style="color:#38bdf8; font-size:11px; margin-top:4px; display:inline-block;">Dica: Use <strong>Ctrl+D</strong> a qualquer momento para pausar ou continuar.</span></div>
  </div>

  <script src="realtime-assistant-overlay.js"></script>
</body>
</html>
