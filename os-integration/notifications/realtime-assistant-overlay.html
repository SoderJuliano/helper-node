<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Assistente em Tempo Real</title>
  <script>
    try {
      if (window.electronAPI && window.electronAPI.platform !== 'linux') {
        document.documentElement.classList.add('manual-drag');
      }
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', 'Inter', system-ui, sans-serif;
      color: #ececec;
      user-select: none;
      overflow: hidden;
    }

    body {
      background: rgba(18, 22, 30, 0.76);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.22);
    }
    @supports not (backdrop-filter: blur(1px)) {
      body { background: #12161e; }
    }

    /* ---------- HEADER ---------- */
    #pos-header {
      height: 26px;
      min-height: 26px;
      background: rgba(56, 189, 248, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1px;
      padding: 0 4px;
      flex-shrink: 0;
      -webkit-app-region: drag;
      cursor: move;
    }
    html.manual-drag #pos-header { -webkit-app-region: no-drag !important; }
    #pos-header .title {
      margin-right: auto;
      padding-left: 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pos-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.35);
      font-size: 10px;
      width: 20px;
      height: 18px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
      padding: 0;
      line-height: 1;
      -webkit-app-region: no-drag;
    }
    .pos-btn:hover  { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.85); }
    .pos-btn:active { background: rgba(255,255,255,0.16); }

    /* ---------- STATUS BAR ---------- */
    #status-bar {
      padding: 7px 14px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.12);
    }
    #status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    #status-dot.listening { background: #38bdf8; animation: pulse 1.8s infinite; }
    #status-dot.speaking  { background: #4ade80; animation: pulse 0.8s infinite; }
    #status-dot.thinking  { background: #facc15; animation: pulse 1s infinite; }
    #status-dot.paused    { background: #64748b; }
    #status-dot.error     { background: #f87171; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.85); }
    }

    /* ---------- MESSAGES ---------- */
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar       { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    #messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

    .tip-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 10px 12px;
      border-left: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.06);
      border-radius: 0 8px 8px 0;
      animation: fadein 0.25s ease;
    }
    .tip-block.mic-turn {
      border-left-color: #38bdf8;
      background: rgba(56, 189, 248, 0.07);
    }
    .tip-block.sys-turn {
      border-left-color: #a78bfa;
      background: rgba(167, 139, 250, 0.07);
    }
    .tip-block.assistant-turn {
      border-left-color: #4ade80;
      background: rgba(74, 222, 128, 0.07);
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tip-time {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .tip-block.mic-turn .tip-time {
      color: #38bdf8;
    }
    .tip-block.sys-turn .tip-time {
      color: #c4b5fd;
    }
    .tip-block.assistant-turn .tip-time {
      color: #4ade80;
    }
    .tip-body {
      font-size: 13.5px;
      line-height: 1.6;
      color: #f3f4f6;
      word-wrap: break-word;
      overflow-wrap: break-word;
      user-select: text;
    }
    .tip-body p { margin: 0 0 6px 0; }
    .tip-body p:last-child { margin-bottom: 0; }
    .tip-body strong { color: #fff; font-weight: 700; }

    .tip-body pre {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 10px 12px;
      margin: 8px 0 4px 0;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.55;
      position: relative;
    }
    .tip-body pre code { font-family: inherit; color: #86efac; white-space: pre; }
    .tip-body code.inline-code {
      background: rgba(255,255,255,0.1);
      padding: 2px 5px;
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92em;
      cursor: pointer;
      user-select: all;
      transition: background 0.15s, color 0.15s;
    }
    .tip-body code.inline-code:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #fff;
    }

    .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      font-size: 10px;
      font-family: inherit;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .copy-btn:hover  { background: rgba(255,255,255,0.14); color: #fff; }
    .copy-btn.copied { background: rgba(74,222,128,0.25); border-color: rgba(74,222,128,0.4); color: #4ade80; }

    /* ---------- EMPTY ---------- */
    #empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.32);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 24px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="pos-header" draggable="false">
    <span class="title">🎙️ Assistente em Tempo Real</span>
    <button class="pos-btn" id="btn-left"    title="Esquerda" draggable="false">◀</button>
    <button class="pos-btn" id="btn-center"  title="Centro" draggable="false">◉</button>
    <button class="pos-btn" id="btn-right"   title="Direita" draggable="false">▶</button>
    <button class="pos-btn" id="btn-monitor" title="Próximo monitor" draggable="false">⊞</button>
    <button class="pos-btn" id="btn-clear"   title="Limpar mensagens" draggable="false">🗑</button>
    <button class="pos-btn" id="btn-pause"   title="Pausar/Retomar captura (ou use Ctrl+D)" draggable="false">⏸</button>
    <button class="pos-btn" id="btn-min"     title="Minimizar" draggable="false">–</button>
  </div>

  <div id="status-bar" draggable="false">
    <div id="status-dot" class="listening" draggable="false"></div>
    <span id="status-text" draggable="false">🎙️ Ouvindo microfone e áudio do sistema (ao vivo)...</span>
  </div>

  <div id="messages">
    <div id="empty">Capturando áudio continuamente.<br>Fale ou reproduza som para ver a transcrição e respostas automáticas aqui.<br><span style="color:#38bdf8; font-size:11px; margin-top:4px; display:inline-block;">Dica: Use <strong>Ctrl+D</strong> a qualquer momento para pausar ou continuar.</span></div>
  </div>

  <script>
    const api = window.electronAPI || {};
    let isListening = true;

    function updateStatus(status, customMsg) {
      const dot  = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      const map = {
        listening: { cls: 'listening', txt: '🎙️ Ouvindo microfone e sistema (ao vivo)...' },
        speaking:  { cls: 'speaking',  txt: '🗣️ Áudio detectado — transcrevendo...' },
        thinking:  { cls: 'thinking',  txt: '🤖 Processando resposta com IA...' },
        paused:    { cls: 'paused',    txt: '⏸️ Pausado — Pressione Ctrl+D para ouvir' },
        error:     { cls: 'error',     txt: '⚠️ ' + (customMsg || 'Erro no áudio/IA') },
      };
      const s = map[status] || map.listening;
      dot.className = '';
      if (s.cls) dot.classList.add(s.cls);
      text.textContent = customMsg || s.txt;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderHtml(text) {
      if (!text) return '';
      let html = '';
      const codeRe = /```(\w*)\n([\s\S]*?)```/g;
      let lastIdx = 0, m;
      const inline = (t) => escapeHtml(t)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`\n]+?)`/g, '<code class="inline-code" title="Clique para copiar">$1</code>')
        .replace(/\n/g, '<br>');
      while ((m = codeRe.exec(text)) !== null) {
        const before = text.slice(lastIdx, m.index);
        if (before.trim()) html += '<p>' + inline(before) + '</p>';
        const lang = (m[1] || 'text').toLowerCase();
        const code = m[2].replace(/\n$/, '');
        html += '<pre><button class="copy-btn">copy</button><code class="lang-' + lang + '">' + escapeHtml(code) + '</code></pre>';
        lastIdx = codeRe.lastIndex;
      }
      const tail = text.slice(lastIdx);
      if (tail.trim()) html += '<p>' + inline(tail) + '</p>';
      return html;
    }

    let currentTurn = {
      id: null,
      audioSource: null,
      userBlock: null,
      assistantBlock: null,
      lastUserText: '',
      lastAssistantText: ''
    };

    function handleUserText(id, text, audioSource) {
      if (!text || !text.trim()) return;
      const empty = document.getElementById('empty');
      if (empty) empty.remove();

      const container = document.getElementById('messages');
      const src = audioSource || 'sys';
      const isMic = (src === 'mic');
      const roleClass = isMic ? 'mic-turn' : 'sys-turn';
      const roleLabel = isMic ? '🎙️ Você (Microfone)' : '🔊 Interlocutor (Sistema)';

      // Se já temos um bloco do mesmo tipo de áudio no turno atual antes da IA responder
      if (currentTurn.userBlock && !currentTurn.assistantBlock && currentTurn.audioSource === src) {
        currentTurn.id = id || currentTurn.id;
        currentTurn.lastUserText = text;
        const body = currentTurn.userBlock.querySelector('.tip-body');
        if (body) body.innerHTML = renderHtml(text);
      } else {
        // Novo bloco de fala
        const block = document.createElement('div');
        block.className = `tip-block ${roleClass}`;

        const now = new Date();
        const hh = String(now.getHours()).padStart(2,'0');
        const mm = String(now.getMinutes()).padStart(2,'0');
        const ts = document.createElement('div');
        ts.className = 'tip-time';
        ts.textContent = roleLabel + ' · ' + hh + ':' + mm;
        block.appendChild(ts);

        const body = document.createElement('div');
        body.className = 'tip-body';
        body.innerHTML = renderHtml(text);
        block.appendChild(body);

        container.appendChild(block);

        currentTurn = {
          id: id,
          audioSource: src,
          userBlock: block,
          assistantBlock: null,
          lastUserText: text,
          lastAssistantText: ''
        };
      }
      container.scrollTop = container.scrollHeight;
    }

    function handleAssistantText(id, text) {
      if (!text || !text.trim()) return;
      const empty = document.getElementById('empty');
      if (empty) empty.remove();

      const container = document.getElementById('messages');

      if (currentTurn.assistantBlock) {
        currentTurn.lastAssistantText = text;
        const body = currentTurn.assistantBlock.querySelector('.tip-body');
        if (body) body.innerHTML = renderHtml(text);
      } else {
        const block = document.createElement('div');
        block.className = 'tip-block assistant-turn';

        const now = new Date();
        const hh = String(now.getHours()).padStart(2,'0');
        const mm = String(now.getMinutes()).padStart(2,'0');
        const ts = document.createElement('div');
        ts.className = 'tip-time';
        ts.textContent = '🤖 Resposta IA · ' + hh + ':' + mm;
        block.appendChild(ts);

        const body = document.createElement('div');
        body.className = 'tip-body';
        body.innerHTML = renderHtml(text);
        block.appendChild(body);

        container.appendChild(block);
        currentTurn.assistantBlock = block;
        currentTurn.lastAssistantText = text;
      }
      container.scrollTop = container.scrollHeight;
    }

    function clearMessages() {
      currentTurn = { id: null, userBlock: null, assistantBlock: null, lastUserText: '', lastAssistantText: '' };
      const container = document.getElementById('messages');
      container.innerHTML = '<div id="empty">Histórico limpo.<br>Continuo ouvindo áudio em segundo plano.</div>';
    }

    // Botões de posição
    document.getElementById('btn-left').addEventListener('click', () => api.overlayPosition?.('left'));
    document.getElementById('btn-center').addEventListener('click', () => api.overlayPosition?.('center'));
    document.getElementById('btn-right').addEventListener('click', () => api.overlayPosition?.('right'));
    document.getElementById('btn-monitor').addEventListener('click', () => api.overlayPosition?.('next-monitor'));
    document.getElementById('btn-clear').addEventListener('click', () => clearMessages());
    document.getElementById('btn-min')?.addEventListener('click', () => {
      if (api.realtimeMinimize) api.realtimeMinimize();
      else if (api.visionGuideMinimize) api.visionGuideMinimize();
    });

    const btnPause = document.getElementById('btn-pause');
    btnPause?.addEventListener('click', () => {
      window.electronAPI?.toggleRecordingShortcut?.();
    });

    // Drag manual (Windows/macOS)
    document.addEventListener('dragstart', (e) => e.preventDefault());
    (function () {
      if (api.platform === 'linux' || !api.startWindowDrag) return;
      const handles = [document.getElementById('pos-header'), document.getElementById('status-bar')].filter(Boolean);
      handles.forEach((h) => {
        h.style.cursor = 'move';
        h.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          if (e.target.closest('button, a, input, textarea, pre, code')) return;
          e.preventDefault();
          api.startWindowDrag();
        });
      });
      const end = () => api.endWindowDrag && api.endWindowDrag();
      window.addEventListener('mouseup', end);
      window.addEventListener('blur', end);
    })();

    // Click-through pass-through
    (function () {
      if (!api.setIgnoreMouseEvents || api.platform === 'linux') return;
      window.addEventListener('mousemove', (e) => {
        const isInteractive = e.target && e.target.closest && e.target.closest('#pos-header, #status-bar, .pos-btn, pre, .copy-btn, code.inline-code, #messages');
        if (isInteractive) {
          api.setIgnoreMouseEvents(false);
        } else {
          api.setIgnoreMouseEvents(true, { forward: true });
        }
      });
      window.addEventListener('mouseleave', () => {
        api.setIgnoreMouseEvents(true, { forward: true });
      });
    })();

    // Copy to clipboard
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy-btn');
      if (btn) {
        const pre = btn.closest('pre');
        const code = pre ? pre.querySelector('code') : null;
        if (!code) return;
        try {
          if (api.copyToClipboard) api.copyToClipboard(code.textContent);
          else await navigator.clipboard.writeText(code.textContent);
          btn.classList.add('copied');
          btn.textContent = '✓ copiado';
          setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'copy'; }, 1300);
        } catch (_) {}
        return;
      }

      const inlineCode = e.target.closest('.tip-body code.inline-code');
      if (inlineCode) {
        try {
          const originalText = inlineCode.textContent;
          if (api.copyToClipboard) api.copyToClipboard(originalText);
          else await navigator.clipboard.writeText(originalText);
          const originalBg = inlineCode.style.background;
          inlineCode.style.background = 'rgba(56, 189, 248, 0.35)';
          inlineCode.style.color = '#38bdf8';
          setTimeout(() => {
            inlineCode.style.background = originalBg;
            inlineCode.style.color = '';
          }, 1000);
        } catch (_) {}
      }
    });

    // Listening status updates from Main process
    if (api.onToggleRecording) {
      api.onToggleRecording((event, data) => {
        if (!data) return;
        isListening = !!data.isRecording;
        if (isListening) {
          updateStatus('listening');
          if (btnPause) { btnPause.textContent = '⏸'; btnPause.title = 'Pausar assistente (ou use Ctrl+D)'; }
        } else {
          updateStatus('paused');
          if (btnPause) { btnPause.textContent = '▶'; btnPause.title = 'Continuar assistente (ou use Ctrl+D)'; }
        }
      });
    }

    // Realtime events
    if (api.onRealtimeAssistantUpdate) {
      api.onRealtimeAssistantUpdate((payload) => {
        if (!payload || !payload.type) return;

        switch (payload.type) {
          case 'state':
            if (payload.state === 'started') {
              isListening = true;
              updateStatus('listening');
            } else if (payload.state === 'stopped') {
              isListening = false;
              updateStatus('paused');
            }
            break;

          case 'segment_start':
            updateStatus('speaking');
            if (currentTurn.assistantBlock) {
              currentTurn = { id: null, userBlock: null, assistantBlock: null, lastUserText: '', lastAssistantText: '' };
            }
            break;

          case 'segment_partial':
            {
              const isMic = (payload.audioSource === 'mic');
              updateStatus('speaking', isMic ? '🎙️ Você falando...' : '🔊 Interlocutor falando...');
              if (payload.text && payload.text.trim().length > 3) {
                handleUserText(payload.id, payload.text, payload.audioSource || 'sys');
              }
            }
            break;

          case 'segment_whisper_correction':
            updateStatus('thinking');
            if (payload.text && payload.text.trim().length > 0) {
              handleUserText(payload.id, payload.text, payload.audioSource || 'sys');
            }
            break;

          case 'segment_response':
            updateStatus('listening');
            if (payload.response && payload.response.trim().length > 0) {
              handleAssistantText(payload.id, payload.response);
            }
            break;

          case 'segment_error':
            updateStatus('error', payload.message || 'Erro ao gerar resposta');
            break;

          case 'fatal_error':
            updateStatus('error', payload.message || 'Erro fatal');
            break;
        }
      });
    }

    updateStatus('listening');
  </script>
</body>
</html>
