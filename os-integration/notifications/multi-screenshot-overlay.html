<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Helper-Node Fila de Capturas</title>
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="multi-screenshot-overlay.css">
</head>
<body>
  <div class="batch-container" id="batch-container">
    <div class="batch-header" id="batch-header">
      <div class="header-left">
        <span class="header-icon">📸</span>
        <span class="header-title">Fila</span>
        <span class="count-badge" id="count-badge">0</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-clear" title="Limpar fila" draggable="false">🗑</button>
        <button class="icon-btn" id="btn-close" title="Fechar (Esc)" draggable="false">✕</button>
      </div>
    </div>

    <div class="thumbnails-wrapper" id="thumbnails-wrapper">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📷</div>
        <div class="empty-title">Fila vazia</div>
        <div class="empty-hint"><kbd>Ctrl+Shift+S</kbd> para capturar</div>
      </div>
      <div class="thumbnails-list" id="thumbnails-list"></div>
    </div>

    <div class="batch-footer">
      <button class="btn-send" id="btn-send" title="Enviar para IA (Alt+S)" disabled>
        <span class="btn-icon">🚀</span>
        <span class="btn-text">Enviar</span>
        <span class="btn-shortcut">Alt+S</span>
      </button>
    </div>
  </div>

  <script src="multi-screenshot-overlay.js"></script>
</body>
</html>
