<!doctype html>
<html>
<head><meta charset="utf-8"><title>native-audio</title></head>
<body>
<script>
// Renderer OCULTO de captura de áudio resiliente (Windows/macOS).
// Captura mic (getUserMedia) e áudio do sistema (getDisplayMedia + loopback),
// converte cada um para PCM s16le / 16 kHz / mono e envia ao main via IPC,
// marcado por source ('mic'|'sys'). O main roteia pros motores de VAD e assistentes.

const { ipcRenderer } = require('electron');

const TARGET_RATE = 16000;
const active = {};   // source -> { stream, ctx, node, srcNode, muteGain, streaming, idleTimer, deviceId }

function log(msg) {
  try { ipcRenderer.send('native-audio-log', msg); } catch (_) {}
}

// Verifica se o stream e contexto da fonte ainda estão vivos e aptos para captura
function isStreamHealthy(source) {
  const a = active[source];
  if (!a || !a.stream || !a.ctx) return false;
  if (a.ctx.state === 'closed') return false;
  const audioTracks = a.stream.getAudioTracks();
  if (!audioTracks || audioTracks.length === 0) return false;
  // A trilha precisa estar em estado 'live' (não 'ended')
  const hasLiveTrack = audioTracks.some((t) => t.readyState === 'live');
  return hasLiveTrack;
}

// Downsample linear de Float32 (srcRate) -> Int16 (16 kHz mono).
function floatTo16kInt16(float32, srcRate) {
  if (srcRate === TARGET_RATE) {
    const out = new Int16Array(float32.length);
    for (let i = 0; i < float32.length; i++) {
      let s = Math.max(-1, Math.min(1, float32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }
  const ratio = srcRate / TARGET_RATE;
  const outLen = Math.floor(float32.length / ratio);
  const out = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const idx = i * ratio;
    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, float32.length - 1);
    const frac = idx - i0;
    let s = float32[i0] * (1 - frac) + float32[i1] * frac; // interpolação linear
    s = Math.max(-1, Math.min(1, s));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

async function attach(source, stream, deviceId = '') {
  // Descarta trilhas de vídeo (getDisplayMedia exige vídeo, mas só queremos áudio).
  stream.getVideoTracks().forEach((t) => {
    try { t.stop(); } catch (_) {}
  });

  const audioTracks = stream.getAudioTracks();
  if (audioTracks.length === 0) {
    log(`${source}: sem trilha de áudio`);
  }

  // Monitora o ciclo de vida de cada trilha (ex: fone desconectado/desligado)
  audioTracks.forEach((track) => {
    track.onended = () => {
      const trackLabel = track.label || 'sem label';
      log(`${source}: trilha de áudio [${trackLabel}] encerrou (fone/microfone desconectado)`);
      const wasStreaming = active[source] && active[source].streaming;
      const savedDevId = active[source] ? active[source].deviceId : deviceId;
      destroySource(source);
      try { ipcRenderer.send('native-audio-device-lost', { source, deviceId: savedDevId }); } catch (_) {}

      // Se a fonte estava gravando/escutando ativamente (ex: Nexa Voice ou Realtime),
      // tenta auto-recuperar o microfone padrão disponível
      if (wasStreaming) {
        log(`${source}: tentando auto-recuperar captura em 500ms...`);
        setTimeout(() => {
          if (!active[source] || !active[source].streaming) {
            startSource(source, savedDevId);
          }
        }, 500);
      }
    };

    track.onmute = () => {
      log(`${source}: trilha de áudio mutada pelo sistema operacional`);
    };

    track.onunmute = () => {
      log(`${source}: trilha de áudio desmutada pelo sistema operacional`);
      if (active[source] && active[source].ctx && active[source].ctx.state === 'suspended') {
        active[source].ctx.resume().catch(() => {});
      }
    };
  });

  const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtxClass();

  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (e) { log(`${source}: ctx.resume erro: ${e.message}`); }
  }

  ctx.onstatechange = () => {
    if (ctx.state === 'suspended' && active[source] && active[source].streaming) {
      ctx.resume().catch(() => {});
    }
  };

  const srcNode = ctx.createMediaStreamSource(stream);
  const node = ctx.createScriptProcessor(4096, 2, 1);

  node.onaudioprocess = (e) => {
    if (!active[source] || !active[source].streaming) return;

    const numChannels = e.inputBuffer.numberOfChannels;
    let input;
    if (numChannels === 1) {
      input = e.inputBuffer.getChannelData(0);
    } else {
      const ch0 = e.inputBuffer.getChannelData(0);
      const ch1 = e.inputBuffer.getChannelData(1);
      input = new Float32Array(ch0.length);
      for (let i = 0; i < ch0.length; i++) {
        input[i] = (ch0[i] + ch1[i]) * 0.5;
      }
    }

    const pcm16 = floatTo16kInt16(input, ctx.sampleRate);
    const bytes = Buffer.from(pcm16.buffer, pcm16.byteOffset, pcm16.byteLength);
    ipcRenderer.send('native-audio-pcm', { source, bytes });
  };

  const muteGain = ctx.createGain();
  muteGain.gain.value = 0;
  srcNode.connect(node);
  node.connect(muteGain);
  muteGain.connect(ctx.destination);

  active[source] = { stream, ctx, node, srcNode, muteGain, streaming: true, idleTimer: null, deviceId };
  const label = (audioTracks[0] && audioTracks[0].label) || (deviceId ? `id:${deviceId.slice(0, 8)}` : 'default');
  log(`${source}: capturando [${label}] @ ${ctx.sampleRate}Hz -> 16kHz mono`);
}

async function startSource(source, deviceId = '') {
  const reqDevId = deviceId ? String(deviceId).trim() : '';

  if (active[source]) {
    // 1. Se mudou o deviceId solicitado, reinicia com o novo microfone
    if (reqDevId && active[source].deviceId !== reqDevId) {
      log(`${source}: trocando dispositivo de [${active[source].deviceId}] para [${reqDevId}]...`);
      destroySource(source);
    } else if (!isStreamHealthy(source)) {
      // 2. Se o stream anterior morreu (ex: fone foi desconectado e reconectado), destrói para recriar do zero
      log(`${source}: stream anterior inválido ou desconectado (trilha morta) -> recriando captura...`);
      destroySource(source);
    } else {
      // 3. Stream saudável existente: reativa e retoma
      active[source].streaming = true;
      if (active[source].idleTimer) {
        clearTimeout(active[source].idleTimer);
        active[source].idleTimer = null;
      }
      if (active[source].ctx && active[source].ctx.state === 'suspended') {
        try { await active[source].ctx.resume(); } catch (_) {}
      }
      ipcRenderer.send('native-audio-ready', { source });
      log(`${source}: retomado (stream aquecido e saudável)`);
      return;
    }
  }

  try {
    let stream;
    if (source === 'mic') {
      const audioConstraints = {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      };
      if (reqDevId && reqDevId !== 'default') {
        audioConstraints.deviceId = { exact: reqDevId };
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: audioConstraints,
          video: false,
        });
      } catch (advancedErr) {
        log(`mic: getUserMedia avançado falhou (${advancedErr.message}), tentando fallback com deviceId ideal ou padrão...`);
        try {
          const fallbackConstraints = (reqDevId && reqDevId !== 'default')
            ? { deviceId: { ideal: reqDevId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            : { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
          stream = await navigator.mediaDevices.getUserMedia({
            audio: fallbackConstraints,
            video: false,
          });
        } catch (_) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true },
              video: false,
            });
          } catch (_) {
            // Último recurso: audio básico
            stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          }
        }
      }
    } else {
      // sys: loopback do sistema (o main aprova via setDisplayMediaRequestHandler).
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: true,
      });
    }

    await attach(source, stream, reqDevId);
    ipcRenderer.send('native-audio-ready', { source });
  } catch (err) {
    log(`${source}: falha ao capturar — ${err && err.message ? err.message : err}`);
    destroySource(source);
    ipcRenderer.send('native-audio-error', { source, error: err && err.message ? err.message : String(err) });
  }
}

function stopSource(source) {
  const a = active[source];
  if (!a) return;
  a.streaming = false;
  if (a.idleTimer) clearTimeout(a.idleTimer);
  // Mantém aquecido por 5s para press-to-talk rápido, liberando hardware logo em seguida
  a.idleTimer = setTimeout(() => {
    destroySource(source);
  }, 5000);
  log(`${source}: gravação pausada (stream mantido aquecido por 5s)`);
}

function destroySource(source) {
  const a = active[source];
  if (!a) return;
  if (a.idleTimer) clearTimeout(a.idleTimer);
  try { a.node.disconnect(); } catch (_) {}
  try { if (a.muteGain) a.muteGain.disconnect(); } catch (_) {}
  try { a.srcNode.disconnect(); } catch (_) {}
  try { a.ctx.close(); } catch (_) {}
  try { a.stream.getTracks().forEach((t) => t.stop()); } catch (_) {}
  delete active[source];
  log(`${source}: encerrado e hardware liberado`);
}

// Listener de alteração de dispositivos de hardware no SO (fone plugado/desplugado, bluetooth ligado/desligado)
if (navigator.mediaDevices && typeof navigator.mediaDevices.addEventListener === 'function') {
  navigator.mediaDevices.addEventListener('devicechange', async () => {
    log('Evento devicechange do sistema detectado (dispositivo de áudio conectado/desconectado)');
    try { ipcRenderer.send('native-audio-device-change'); } catch (_) {}

    for (const source of ['mic', 'sys']) {
      const a = active[source];
      if (!a) continue;

      // Se o stream ativo morreu com a mudança de dispositivo, reconecta
      if (!isStreamHealthy(source)) {
        log(`${source}: stream tornou-se inválido após devicechange -> reiniciando...`);
        const wasStreaming = a.streaming;
        const curDevId = a.deviceId;
        destroySource(source);
        if (wasStreaming) {
          setTimeout(() => startSource(source, curDevId), 400);
        }
      }
    }
  });
}

// Lista dispositivos de áudio disponíveis
ipcRenderer.on('native-audio-list-devices', async (_e, { reqId }) => {
  try {
    let devs = [];
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      let all = await navigator.mediaDevices.enumerateDevices();
      if (all.some(d => d.kind === 'audioinput' && !d.label)) {
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          tempStream.getTracks().forEach(t => t.stop());
          all = await navigator.mediaDevices.enumerateDevices();
        } catch (_) {}
      }
      devs = all
        .filter(d => d.kind === 'audioinput')
        .map(d => ({
          name: d.deviceId,
          description: d.label || (d.deviceId === 'default' ? 'Padrão do Sistema' : `Microfone (${d.deviceId.slice(0, 8)})`)
        }));
    }
    ipcRenderer.send('native-audio-list-devices-reply', { reqId, devices: devs });
  } catch (err) {
    ipcRenderer.send('native-audio-list-devices-reply', { reqId, devices: [], error: err.message });
  }
});

ipcRenderer.on('native-audio-start', (_e, { source, deviceId }) => { startSource(source, deviceId); });
ipcRenderer.on('native-audio-stop', (_e, { source }) => { stopSource(source); });
ipcRenderer.on('native-audio-destroy', (_e, { source }) => { destroySource(source); });
ipcRenderer.on('native-audio-restart', (_e, { source, deviceId }) => {
  log(`${source}: reinício forçado solicitado`);
  destroySource(source);
  startSource(source, deviceId);
});

log('renderer pronto');
ipcRenderer.send('native-audio-renderer-ready');
</script>
</body>
</html>
